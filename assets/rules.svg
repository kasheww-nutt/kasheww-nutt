<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="352" viewBox="0 0 1118 352" role="img" aria-label="Six rules I hold my experiments to: baseline first, a locked test set, splits by time or person, no leakage, publish the losses, make it rerunnable.">
<title>Six rules I hold my experiments to: baseline first, a locked test set, splits by time or person, no leakage, publish the losses, make it rerunnable.</title>
<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ln{opacity:0;animation:in .35s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.dot{opacity:0;animation:pop .25s steps(2) forwards}@keyframes pop{to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<rect width="1118" height="352" fill="#0c0d12"/>
<path d="M18 338V22H32 M376 22H1100V338H18" fill="none" stroke="#3a3f4c" stroke-dasharray="6 5"/>
<text x="40" y="27" font-size="17" font-weight="700" fill="#d9a441">[ HOW I TRY NOT TO FOOL MYSELF ]</text>
<text x="40" y="56" font-size="13" fill="#8e95a4">$ cat RULES.md<tspan class="cur" fill="#d4d8e0">_</tspan></text>
<g class="ln" style="animation-delay:0.40s"><text x="40" y="100" font-size="15"><tspan fill="#5d6474">01 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">beat the dumb baseline first</tspan></text><text x="430" y="100" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>persistence (&quot;tomorrow = today&quot;) is in every AQI comparison</text></g>
<g class="ln" style="animation-delay:0.72s"><text x="40" y="133" font-size="15"><tspan fill="#5d6474">02 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">lock the test set</tspan></text><text x="430" y="133" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>the 2025 test year is hashed and scored exactly once</text></g>
<g class="ln" style="animation-delay:1.04s"><text x="40" y="166" font-size="15"><tspan fill="#5d6474">03 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">split by time, or by person</tspan></text><text x="430" y="166" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>train 2018-22 → test 2025 · leave-one-subject-out on WESAD</text></g>
<g class="ln" style="animation-delay:1.36s"><text x="40" y="199" font-size="15"><tspan fill="#5d6474">04 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">make leakage impossible</tspan></text><text x="430" y="199" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>45 features carry their day offset; a guard halts the run</text></g>
<g class="ln" style="animation-delay:1.68s"><text x="40" y="232" font-size="15"><tspan fill="#5d6474">05 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">publish the losses</tspan></text><text x="430" y="232" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>0.92x and n.s. are on this page, next to the wins</text></g>
<g class="ln" style="animation-delay:2.00s"><text x="40" y="265" font-size="15"><tspan fill="#5d6474">06 </tspan><tspan fill="#3ddc97">[✓] </tspan><tspan fill="#f2f4f8" font-weight="700">make it rerunnable</tspan></text><text x="430" y="265" font-size="13" fill="#8e95a4"><tspan fill="#5d6474">→ </tspan>pinned versions, fixed seeds, an audit that needs no GPU</text></g>
<text class="ln" style="animation-delay:2.62s" x="40" y="316" font-size="13" fill="#5d6474"># "you must not fool yourself, and you are the easiest person to fool." <tspan fill="#d9a441">feynman</tspan></text>
</svg>