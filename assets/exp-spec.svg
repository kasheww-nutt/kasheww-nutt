<text x="40" y="56" font-size="13" fill="#8e95a4">$ bench --draft qwen2.5-0.5b --target qwen2.5-3b<tspan class="cur" fill="#d4d8e0">_</tspan></text>
<g class="pulse"><rect x="456.8" y="17" width="59.2" height="19" fill="#ff3b4e" fill-opacity=".14" stroke="#ff3b4e" stroke-opacity=".7"/><text x="486.4" y="31" font-size="12" font-weight="700" fill="#ff3b4e" text-anchor="middle">SLOWER</text></g>
<text x="40" y="92" font-size="17" font-weight="700" fill="#f2f4f8">Is speculative decoding faster in Hindi and</text>
