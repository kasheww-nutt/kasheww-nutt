<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372" role="img" aria-label="Terminal: Shaik Kashif runs every model against its baseline and reports the result either way">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .p { fill: #58a6ff; }
    .ok { fill: #3fb950; font-weight: 700; }
    .no { fill: #d29922; font-weight: 700; }
    .bad { fill: #f85149; font-weight: 700; }
    .hd { fill: #8b949e; font-size: 12.5px; }
    .l { animation: show .35s ease-out both; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .cur { animation: blink 1s steps(1) 6.4s infinite both; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .scan { animation: scan 1.1s ease-out 2.2s both; transform-origin: 0 0; }
    @keyframes scan { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <rect x="1" y="1" width="858" height="370" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="38" rx="12" fill="#161b22"/>
  <rect x="1" y="27" width="858" height="12" fill="#161b22"/>
  <line x1="1" y1="39" x2="859" y2="39" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/>
  <circle cx="44" cy="20" r="6" fill="#d29922"/>
  <circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="430" y="25" text-anchor="middle" class="t hd" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">kashif@pune: ~/experiments</text>

  <g class="l" style="animation-delay:.3s"><text x="28" y="76" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan class="p" fill="#58a6ff">$</tspan> whoami</text></g>
  <g class="l" style="animation-delay:.9s"><text x="28" y="102" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">Shaik Kashif <tspan class="dim" fill="#8b949e">· B.Tech AI and ML, SIT Pune, class of 2028</tspan></text></g>

  <g class="l" style="animation-delay:1.7s"><text x="28" y="144" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan class="p" fill="#58a6ff">$</tspan> ./evaluate --all --against-baseline</text></g>
  <rect class="scan" x="28" y="156" width="804" height="1.5" fill="#30363d"/>

  <g class="l" style="animation-delay:3.0s">
    <text x="28" y="186" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">delhi-air-quality</text>
    <text x="250" y="186" class="t dim" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">macro-F1</text>
    <text x="352" y="186" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">0.600 vs 0.583</text>
    <text x="832" y="186" text-anchor="end" class="t ok" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700">BEAT BASELINE</text>
  </g>
  <g class="l" style="animation-delay:3.6s">
    <text x="28" y="214" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">agriminds-wheat</text>
    <text x="250" y="214" class="t dim" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">accuracy</text>
    <text x="352" y="214" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">91.0% vs 88.0%</text>
    <text x="832" y="214" text-anchor="end" class="t ok" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700">BEAT BASELINE</text>
  </g>
  <g class="l" style="animation-delay:4.2s">
    <text x="28" y="242" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">diffusion-eda</text>
    <text x="250" y="242" class="t dim" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">15 folds</text>
    <text x="352" y="242" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">p ≥ 0.54 everywhere</text>
    <text x="832" y="242" text-anchor="end" class="t no" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700">NO GAIN</text>
  </g>
  <g class="l" style="animation-delay:4.8s">
    <text x="28" y="270" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">speculative-decoding</text>
    <text x="250" y="270" class="t dim" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">speed</text>
    <text x="352" y="270" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">0.92x of plain decoding</text>
    <text x="832" y="270" text-anchor="end" class="t bad" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700">SLOWER</text>
  </g>

  <g class="l" style="animation-delay:5.6s"><text x="28" y="312" class="t dim" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">2 wins, 2 losses. Reported either way.</text></g>
  <g class="l" style="animation-delay:6.2s"><text x="28" y="344" class="t" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><tspan class="p" fill="#58a6ff">$</tspan> </text></g>
  <rect class="cur" x="48" y="330" width="9" height="18" fill="#c9d1d9"/>
</svg>
