<svg xmlns="http://www.w3.org/2000/svg" width="552" height="340" viewBox="0 0 552 340" role="img" aria-label="Does diffusion-generated sensor data help stress detection? no gain.">
<title>Does diffusion-generated sensor data help stress detection? no gain.</title>
<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ln{opacity:0;animation:in .35s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.dot{opacity:0;animation:pop .25s steps(2) forwards}@keyframes pop{to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<rect width="552" height="340" fill="#0c0d12"/>
<path d="M18 326V22H32 M356 22H534V326H18" fill="none" stroke="#3a3f4c" stroke-dasharray="6 5"/>
<text x="40" y="27" font-size="17" font-weight="700" fill="#d9a441">[ 03 · SYNTHETIC SENSOR DATA ]</text>
<text x="40" y="56" font-size="13" fill="#8e95a4">$ run_all --loso --augment ddpm<tspan class="cur" fill="#d4d8e0">_</tspan></text>
<g class="pulse"><rect x="449.6" y="17" width="66.4" height="19" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/><text x="482.8" y="31" font-size="12" font-weight="700" fill="#ffb547" text-anchor="middle">NO GAIN</text></g>
<text x="40" y="92" font-size="17" font-weight="700" fill="#f2f4f8">Does diffusion-generated sensor data help</text>
<text x="40" y="115" font-size="17" font-weight="700" fill="#f2f4f8">stress detection?</text>
<text x="40" y="152" font-size="12" fill="#5d6474">one dot per held-out person · filled = significant gain</text>
<text class="dot" style="animation-delay:0.30s" x="40" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.38s" x="61" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.46s" x="82" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.54s" x="103" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.62s" x="124" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.70s" x="145" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.78s" x="166" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.86s" x="187" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:0.94s" x="208" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.02s" x="229" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.10s" x="250" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.18s" x="271" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.26s" x="292" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.34s" x="313" y="180" font-size="17" fill="#ffb547">○</text>
<text class="dot" style="animation-delay:1.42s" x="334" y="180" font-size="17" fill="#ffb547">○</text>
<text class="ln" style="animation-delay:1.7s" x="363" y="179" font-size="13" font-weight="700" fill="#ffb547">0/15 · n.s.</text>
<text x="40" y="224" font-size="13" fill="#8e95a4"><tspan fill="#5d6474"># </tspan>leave-one-subject-out: the test person never trains</text>
<text x="40" y="244" font-size="13" fill="#8e95a4"><tspan fill="#5d6474"># </tspan>classifier already at 0.90 with 5% of the data</text>
<text x="40" y="310" font-size="13" fill="#5d6474">→ repo private for now</text>
</svg>