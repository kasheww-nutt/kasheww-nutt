<svg xmlns="http://www.w3.org/2000/svg" width="552" height="340" viewBox="0 0 552 340" role="img" aria-label="Do three CNNs together beat the best one? beat best single.">
<title>Do three CNNs together beat the best one? beat best single.</title>
<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ln{opacity:0;animation:in .35s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.dot{opacity:0;animation:pop .25s steps(2) forwards}@keyframes pop{to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<rect width="552" height="340" fill="#0c0d12"/>
<path d="M18 326V22H32 M356 22H534V326H18" fill="none" stroke="#3a3f4c" stroke-dasharray="6 5"/>
<text x="40" y="27" font-size="17" font-weight="700" fill="#d9a441">[ 02 · CROP DISEASE ENSEMBLE ]</text>
<text x="40" y="56" font-size="13" fill="#8e95a4">$ evaluate --crop wheat --ensemble 3<tspan class="cur" fill="#d4d8e0">_</tspan></text>
<g class="pulse"><rect x="384.8" y="17" width="131.2" height="19" fill="#3ddc97" fill-opacity=".14" stroke="#3ddc97" stroke-opacity=".7"/><text x="450.4" y="31" font-size="12" font-weight="700" fill="#3ddc97" text-anchor="middle">BEAT BEST SINGLE</text></g>
<text x="40" y="92" font-size="17" font-weight="700" fill="#f2f4f8">Do three CNNs together beat the best one?</text>
<text x="40" y="129" font-size="12" fill="#5d6474">accuracy, wheat · axis 80.0% to 95.0%</text>
<text x="40" y="153" font-size="13" fill="#8e95a4">3-cnn ensemble</text>
<text class="bar" style="animation-delay:0.30s" x="196" y="153" font-size="13" fill="#3ddc97">████████████████████</text>
<text class="ln" style="animation-delay:1.20s" x="434" y="153" font-size="13" font-weight="700" fill="#3ddc97">91.0%</text>
<text x="40" y="179" font-size="13" fill="#8e95a4">best single cnn</text>
<text class="bar" style="animation-delay:0.55s" x="196" y="179" font-size="13" fill="#8e95a4">███████████████</text>
<text class="ln" style="animation-delay:1.45s" x="434" y="179" font-size="13" font-weight="700" fill="#8e95a4">88.0%</text>
<text x="40" y="211" font-size="13" fill="#8e95a4"><tspan fill="#5d6474"># </tspan>helps on hard crops like wheat</text>
<text x="40" y="231" font-size="13" fill="#8e95a4"><tspan fill="#5d6474"># </tspan>on easy crops it changed almost nothing</text>
<text x="40" y="251" font-size="13" fill="#8e95a4"><tspan fill="#5d6474"># </tspan>pre-audit numbers; being rebuilt crop by crop</text>
<text x="40" y="310" font-size="13" fill="#7aa7ff">→ github.com/kasheww-nutt/AgriMinds</text>
</svg>