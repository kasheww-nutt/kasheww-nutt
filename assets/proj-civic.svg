<svg xmlns="http://www.w3.org/2000/svg" width="552" height="316" viewBox="0 0 552 316" role="img" aria-label="CivicPulse AI: Photograph a pothole and the app files the report.">
<title>CivicPulse AI: Photograph a pothole and the app files the report.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.live{animation:live 1.8s ease-in-out infinite}@keyframes live{50%{opacity:.25}}
.sheen{animation:sheen 7s ease-in-out infinite}@keyframes sheen{0%,60%{transform:translateX(-700px)}100%{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131620"/><stop offset="1" stop-color="#0e1017"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa7ff" stop-opacity="0"/><stop offset=".5" stop-color="#7aa7ff" stop-opacity=".8"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo" cx=".15" cy="0" r=".9"><stop offset="0" stop-color="#7aa7ff" stop-opacity=".10"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".035"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="1" y="1" width="550" height="314" rx="18"/></clipPath>
</defs>
<rect width="552" height="316" fill="#0c0d12"/>
<g clip-path="url(#cl)">
<rect x="1" y="1" width="550" height="314" fill="url(#bg)"/>
<rect x="1" y="1" width="550" height="314" fill="url(#halo)"/>
<rect class="sheen" x="0" y="0" width="260" height="316" fill="url(#sw)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="550" height="314" rx="18" fill="none" stroke="#252a36"/>
<rect x="40" y="1" width="472" height="1.5" fill="url(#top)"/>
<text x="32" y="46" font-size="12" font-weight="600" letter-spacing="1.6" fill="#8e95a4">HACKATHON · ONE WEEK</text>
<text x="32" y="84" font-size="22" font-weight="700" fill="#f4f6fb">CivicPulse AI</text>
<text x="32" y="112" font-size="14.5" fill="#c9ceda">Photograph a pothole and the app files the report.</text>
<g class="up" style="animation-delay:0.20s"><rect x="32.0" y="126" width="52.4" height="30" rx="8" fill="#7aa7ff" fill-opacity="0.08" stroke="#7aa7ff" stroke-opacity=".35"/><text x="41.0" y="146" font-size="12.5" font-weight="600" fill="#f4f6fb">Photo</text></g>
<path d="M88.4 141h10m-4 -4l4 4-4 4" stroke="#d9a441" stroke-width="1.6" fill="none"/>
<g class="up" style="animation-delay:0.38s"><rect x="102.4" y="126" width="100.5" height="30" rx="8" fill="#7aa7ff" fill-opacity="0.13" stroke="#7aa7ff" stroke-opacity=".35"/><text x="111.4" y="146" font-size="12.5" font-weight="600" fill="#f4f6fb">Vision model</text></g>
<path d="M206.9 141h10m-4 -4l4 4-4 4" stroke="#d9a441" stroke-width="1.6" fill="none"/>
<g class="up" style="animation-delay:0.56s"><rect x="220.9" y="126" width="148.6" height="30" rx="8" fill="#7aa7ff" fill-opacity="0.18" stroke="#7aa7ff" stroke-opacity=".35"/><text x="229.9" y="146" font-size="12.5" font-weight="600" fill="#f4f6fb">Category + severity</text></g>
<path d="M373.5 141h10m-4 -4l4 4-4 4" stroke="#d9a441" stroke-width="1.6" fill="none"/>
<g class="up" style="animation-delay:0.74s"><rect x="387.5" y="126" width="100.5" height="30" rx="8" fill="#7aa7ff" fill-opacity="0.23" stroke="#7aa7ff" stroke-opacity=".35"/><text x="396.5" y="146" font-size="12.5" font-weight="600" fill="#f4f6fb">Report filed</text></g>
<rect x="32.0" y="176" width="78.2" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="43.0" y="193.5" font-size="12.5" fill="#8e95a4">AI vision</text>
<rect x="118.2" y="176" width="72.0" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="129.2" y="193.5" font-size="12.5" fill="#8e95a4">Live map</text>
<rect x="198.2" y="176" width="122.0" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="209.2" y="193.5" font-size="12.5" fill="#8e95a4">Geofenced alerts</text>
<line x1="32" y1="258" x2="520" y2="258" stroke="#252a36"/><path d="M33 286L41 278M35 278H41V284" stroke="#7aa7ff" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="52" y="290" font-size="14" font-weight="600" fill="#7aa7ff">Open the live demo</text><text x="520" y="290" font-size="12" fill="#5d6474" text-anchor="end">wakes in ~30 s</text>
</svg>