  <text x="380" y="114" font-size="12">OURS</text>
  <text x="470" y="114" font-size="12">BASELINE</text>
  <text x="690" y="114" font-size="12" text-anchor="middle">Δ VS BASELINE</text>
  <text x="1076" y="114" font-size="12" text-anchor="end">VERDICT</text>
</g>
