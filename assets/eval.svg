<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1116 400" width="1116" height="400" role="img" aria-label="Every model against its baseline: 2 wins, 2 losses, reported either way">
<title>evaluate --all --against-baseline</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:16px;white-space:pre}
.row{opacity:0;animation:row .45s ease-out forwards}
@keyframes row{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.grow{transform:scaleX(0);transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:inherit}
.gl{transform-origin:0 50%}.gr{transform-origin:100% 50%}
.barwrap .grow{animation-delay:inherit}
@keyframes grow{to{transform:scaleX(1)}}
.foot{opacity:0;animation:row .5s 3.00s ease-out forwards}
.cur{animation:blink 1.06s steps(1) 3.40s infinite}
@keyframes blink{50%{opacity:0}}
.rec{animation:blink 1.2s steps(1) infinite}
.scan{transform:scaleX(0);transform-origin:0 0;transform-box:fill-box;animation:grow .9s .35s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>
<rect width="1116" height="400" rx="6" fill="#0a0b10"/>
<path d="M10 32V10H32 M1084 10H1106V32 M1106 368V390H1084 M32 390H10V368" fill="none" stroke="#7ee7ff" stroke-opacity=".55" stroke-width="1.5"/>

<circle class="rec" cx="34" cy="43" r="5" fill="#ff3b4e"/>
<text x="46" y="48" font-size="13" font-weight="700" fill="#e8ecf4" letter-spacing="1.5">EVAL</text>
<text x="96" y="48" font-size="15" fill="#8a93a8"><tspan fill="#7ee7ff">kashif@pune</tspan>:~/experiments<tspan fill="#7ee7ff"> $</tspan> <tspan fill="#e8ecf4">./evaluate --all --against-baseline</tspan></text>
<text x="1084" y="48" text-anchor="end" font-size="13" fill="#8a93a8">4 runs · every result shown</text>
<rect class="scan" x="24" y="68" width="1068" height="1" fill="#7ee7ff" fill-opacity=".35"/>

