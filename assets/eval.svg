<g class="foot">
  <text x="40" y="360" fill="#8a93a8"><tspan fill="#3ddc97" font-weight="700">2 wins</tspan> · <tspan fill="#ff3b4e" font-weight="700">2 losses</tspan> · reported either way.</text>
  <text x="1084" y="360" text-anchor="end" fill="#7ee7ff">$ <tspan class="cur" fill="#e8ecf4">▍</tspan></text>
