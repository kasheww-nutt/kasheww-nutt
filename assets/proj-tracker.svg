<svg xmlns="http://www.w3.org/2000/svg" width="552" height="316" viewBox="0 0 552 316" role="img" aria-label="Fitness tracker: A fitness and nutrition tracker I actually use every day.">
<title>Fitness tracker: A fitness and nutrition tracker I actually use every day.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.live{animation:live 1.8s ease-in-out infinite}@keyframes live{50%{opacity:.25}}
.sheen{animation:sheen 7s ease-in-out infinite}@keyframes sheen{0%,60%{transform:translateX(-700px)}100%{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131620"/><stop offset="1" stop-color="#0e1017"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset=".5" stop-color="#3ddc97" stop-opacity=".8"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient>
<radialGradient id="halo" cx=".15" cy="0" r=".9"><stop offset="0" stop-color="#3ddc97" stop-opacity=".10"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".035"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="1" y="1" width="550" height="314" rx="18"/></clipPath>
</defs>
<rect width="552" height="316" fill="#0c0d12"/>
<g clip-path="url(#cl)">
<rect x="1" y="1" width="550" height="314" fill="url(#bg)"/>
<rect x="1" y="1" width="550" height="314" fill="url(#halo)"/>
<rect class="sheen" x="0" y="0" width="260" height="316" fill="url(#sw)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="550" height="314" rx="18" fill="none" stroke="#252a36"/>
<rect x="40" y="1" width="472" height="1.5" fill="url(#top)"/>
<text x="32" y="46" font-size="12" font-weight="600" letter-spacing="1.6" fill="#8e95a4">FULL-STACK APP</text>
<text x="32" y="84" font-size="22" font-weight="700" fill="#f4f6fb">Fitness tracker</text>
<text x="32" y="112" font-size="14.5" fill="#c9ceda">A fitness and nutrition tracker I actually use every day.</text>
<g class="up" style="animation-delay:0.20s"><circle cx="40" cy="141" r="8" fill="#3ddc97" fill-opacity=".14"/><path d="M36.5 141l2.5 2.6 4.8-5" stroke="#3ddc97" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="146" font-size="13.5" fill="#c9ceda">Typecheck and build on every push</text></g>
<g class="up" style="animation-delay:0.35s"><circle cx="40" cy="167" r="8" fill="#3ddc97" fill-opacity=".14"/><path d="M36.5 167l2.5 2.6 4.8-5" stroke="#3ddc97" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="172" font-size="13.5" fill="#c9ceda">14 test files</text></g>
<g class="up" style="animation-delay:0.50s"><circle cx="40" cy="193" r="8" fill="#3ddc97" fill-opacity=".14"/><path d="M36.5 193l2.5 2.6 4.8-5" stroke="#3ddc97" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="198" font-size="13.5" fill="#c9ceda">Smoke test: auth, MCP logging, backup and restore</text></g>
<rect x="32.0" y="220" width="65.8" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="43.0" y="237.5" font-size="12.5" fill="#8e95a4">Next.js</text>
<rect x="105.8" y="220" width="59.5" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="116.8" y="237.5" font-size="12.5" fill="#8e95a4">SQLite</text>
<rect x="173.2" y="220" width="97.0" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="184.2" y="237.5" font-size="12.5" fill="#8e95a4">OAuth (PKCE)</text>
<rect x="278.2" y="220" width="59.5" height="26" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#252a36"/><text x="289.2" y="237.5" font-size="12.5" fill="#8e95a4">Docker</text>
<line x1="32" y1="258" x2="520" y2="258" stroke="#252a36"/><path d="M33 286L41 278M35 278H41V284" stroke="#3ddc97" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="52" y="290" font-size="14" font-weight="600" fill="#3ddc97">lean-muscle-tracker</text><text x="520" y="290" font-size="12" fill="#5d6474" text-anchor="end">view the repo</text>
</svg>