<svg xmlns="http://www.w3.org/2000/svg" width="552" height="384" viewBox="0 0 552 384" role="img" aria-label="Is speculative decoding faster in Hindi and Urdu? Verdict: slower.">
<title>Is speculative decoding faster in Hindi and Urdu? Verdict: slower.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.live{animation:live 1.8s ease-in-out infinite}@keyframes live{50%{opacity:.25}}
.sheen{animation:sheen 7s ease-in-out infinite}@keyframes sheen{0%,60%{transform:translateX(-700px)}100%{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131620"/><stop offset="1" stop-color="#0e1017"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d5e" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d5e" stop-opacity=".8"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></linearGradient>
<radialGradient id="halo" cx=".15" cy="0" r=".9"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".10"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".035"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="1" y="1" width="550" height="382" rx="18"/></clipPath>
</defs>
<rect width="552" height="384" fill="#0c0d12"/>
<g clip-path="url(#cl)">
<rect x="1" y="1" width="550" height="382" fill="url(#bg)"/>
<rect x="1" y="1" width="550" height="382" fill="url(#halo)"/>
<rect class="sheen" x="0" y="0" width="260" height="384" fill="url(#sw)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="550" height="382" rx="18" fill="none" stroke="#252a36"/>
<rect x="40" y="1" width="472" height="1.5" fill="url(#top)"/>
<text x="32" y="46" font-size="12" font-weight="600" letter-spacing="1.6" fill="#8e95a4">EXPERIMENT 04 · LLM INFERENCE</text>
<rect x="434.8" y="27" width="89.2" height="26" rx="13" fill="#ff4d5e" fill-opacity=".12" stroke="#ff4d5e" stroke-opacity=".45"/><circle class="live" cx="448.8" cy="40" r="3.5" fill="#ff4d5e"/><text x="458.8" y="44.5" font-size="12" font-weight="700" letter-spacing=".8" fill="#ff4d5e">SLOWER</text>
<text class="up" x="32" y="90" font-size="21" font-weight="700" fill="#f4f6fb">Is speculative decoding faster in Hindi</text>
<text class="up" x="32" y="118" font-size="21" font-weight="700" fill="#f4f6fb">and Urdu?</text>
<text x="32" y="156" font-size="12" fill="#5d6474">speedup vs the target model alone, best K · axis starts at 0.00×</text>
<text x="32" y="187" font-size="14" fill="#c9ceda">English</text><rect x="186" y="177" width="254" height="12" rx="6" fill="#1d222d"/><rect class="bar" style="animation-delay:0.25s" x="186" y="177" width="212.4" height="12" rx="6" fill="#ff4d5e"/><text class="m" x="520" y="188" font-size="15" font-weight="700" fill="#ff4d5e" text-anchor="end">0.92×</text>
<text x="32" y="217" font-size="14" fill="#c9ceda">Hindi</text><rect x="186" y="207" width="254" height="12" rx="6" fill="#1d222d"/><rect class="bar" style="animation-delay:0.45s" x="186" y="207" width="196.3" height="12" rx="6" fill="#ff4d5e"/><text class="m" x="520" y="218" font-size="15" font-weight="700" fill="#ff4d5e" text-anchor="end">0.85×</text>
<text x="32" y="247" font-size="14" fill="#c9ceda">Urdu</text><rect x="186" y="237" width="254" height="12" rx="6" fill="#1d222d"/><rect class="bar" style="animation-delay:0.65s" x="186" y="237" width="163.9" height="12" rx="6" fill="#ff4d5e"/><text class="m" x="520" y="248" font-size="15" font-weight="700" fill="#ff4d5e" text-anchor="end">0.71×</text>
<line x1="416.9" y1="170" x2="416.9" y2="256" stroke="#f4f6fb" stroke-opacity=".7" stroke-dasharray="3 3"/><text x="416.9" y="271" font-size="11" fill="#c9ceda" text-anchor="middle">1.00× = no gain</text>
